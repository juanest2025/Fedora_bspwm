;==========================================================
; Polybar - Minimal BSPWM
;==========================================================

[colors]
background = #CC1E1E2E
background-alt = #313244
foreground = #CDD6F4
primary = #89B4FA
secondary = #94E2D5
alert = #F38BA8
disabled = #6C7086

;==========================================================
; BAR
;==========================================================

[bar/main]
width = 100%
height = 30
radius = 10

offset-x = 5
offset-y = 5

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 0
border-size = 0

padding-left = 2
padding-right = 2

module-margin = 1

font-0 = JetBrainsMono Nerd Font Propo:size=11;2

modules-left = bspwm
modules-center = xwindow
modules-right = pulseaudio memory backlight network bluetooth battery date tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = bspwm

;==========================================================
; BSPWM
;==========================================================

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
enable-click = true
enable-scroll = true
reverse-scroll = false

label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = #1E1E2E
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2

; No mostrar escritorios vacíos
label-empty =

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = #1E1E2E
label-urgent-padding = 2

;==========================================================
; ACTIVE WINDOW
;==========================================================

[module/xwindow]
type = internal/xwindow

label = %title:0:80:...%

;==========================================================
; AUDIO
;==========================================================

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = true

format-volume = 󰕾 <label-volume>
label-volume = %percentage%%

format-muted = 󰝟 muted

;==========================================================
; MEMORY
;==========================================================

[module/memory]
type = internal/memory

interval = 2

format = 󰍛 <label>
label = %percentage_used%%

;==========================================================
; BACKLIGHT
;==========================================================

[module/backlight]
type = internal/backlight

card = intel_backlight

format = 󰃠 <label>
label = %percentage%%

;==========================================================
; NETWORK
;==========================================================

[module/network]
type = internal/network

interface = wlo1
interval = 3

format-connected = %{A1:kitty -e nmtui &:}<ramp-signal> <label-connected>%{A}
format-disconnected = %{A1:kitty -e nmtui &:}󰤭 Offline%{A}

label-connected = 

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

;==========================================================
; BLUETOOTH
;==========================================================

[module/bluetooth]
type = custom/script

exec = timeout 2 bluetoothctl show | grep -q "Powered: yes" && echo "󰂯" || echo "󰂲"
interval = 5

;==========================================================
; BATTERY
;==========================================================

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

poll-interval = 5

low-at = 15

format-charging = 󰂄 <label-charging>
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-full = 󰁹 100%

label-low = %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂

;==========================================================
; DATE & TIME
;==========================================================

[module/date]
type = internal/date

interval = 1

date = %a %d %b
time = %H:%M

format = 󰃰 <label>
label = %date%  %time%

;==========================================================
; SYSTEM TRAY (Polybar 3.7+)
;==========================================================

[module/tray]
type = internal/tray

tray-spacing = 6px
tray-size = 16

;==========================================================
; SETTINGS
;==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = true
