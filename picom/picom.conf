#################################
# Backend
#################################

backend = "glx";

# Evita tearing
vsync = true;

# Usa shaders más suaves
glx-no-stencil = true;
glx-copy-from-front = false;


#################################
# Transparencias
#################################

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;

inactive-opacity-override = false;


#################################
# Sombras
#################################

shadow = true;

shadow-radius = 18;
shadow-offset-x = -8;
shadow-offset-y = -8;

shadow-opacity = 0.35;

shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'dunst'",
  "class_g = 'swaync'",
  "name *= 'Notification'"
];


#################################
# Bordes redondeados
#################################

corner-radius = 14;

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'kitty'"
];


#################################
# Animaciones suaves
#################################

fading = true ;

fade-in-step = 0.35;
fade-out-step = 035;

fade-delta = 5;


#################################
# Blur
#################################

blur-method = "dual_kawase";

blur-strength = 5;

blur-background = true;
blur-background-frame = true;

blur-background-fixed = false;


#################################
# General
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-rounded-corners = true;

detect-client-opacity = true;

use-ewmh-active-win = true;


#################################
# Opacidad por aplicaciones
#################################

opacity-rule = [
  "92:class_g = 'kitty'",
  "92:class_g = 'Alacritty'",
  "90:class_g = 'Thunar'",
  "95:class_g = 'Brave-browser'"
];
